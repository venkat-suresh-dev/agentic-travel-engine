<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="prov-title prov-desc">
  <title id="prov-title">Provider Architecture</title>
  <desc id="prov-desc">LangGraph tool nodes through normalized contracts to provider adapters and external services.</desc>

  <rect width="1200" height="760" fill="#f4efe6"/>

  <text x="48" y="52" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="600" fill="#1f2421">Provider Architecture</text>
  <text x="48" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#8b8173">LangGraph -&gt; tool interfaces -&gt; normalized contracts -&gt; provider adapters</text>

  <!-- stack -->
  <rect x="350" y="110" width="500" height="48" rx="14" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="140" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1f2421">LangGraph</text>

  <line x1="600" y1="158" x2="600" y2="178" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,178 596,170 604,170" fill="#0d5c63" opacity="0.6"/>

  <rect x="300" y="178" width="600" height="48" rx="14" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="208" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1f2421">Tool Interfaces</text>

  <line x1="600" y1="226" x2="600" y2="246" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,246 596,238 604,238" fill="#0d5c63" opacity="0.6"/>

  <rect x="250" y="246" width="700" height="48" rx="14" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="600" y="270" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0d5c63">Normalized Contracts</text>
  <text x="600" y="286" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">Pydantic schemas, provenance metadata, Decimal money</text>

  <line x1="600" y1="294" x2="600" y2="314" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,314 596,306 604,306" fill="#0d5c63" opacity="0.6"/>

  <rect x="200" y="314" width="800" height="48" rx="14" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="338" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#1f2421">Provider Adapters</text>
  <text x="600" y="354" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">retry, timeout, cache-on-error, source tagging</text>

  <!-- adapter boundary line -->
  <line x1="80" y1="390" x2="1120" y2="390" stroke="#0d5c63" stroke-width="1.5" opacity="0.4"/>
  <text x="600" y="410" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0d5c63">Provider-specific schemas terminate below this boundary</text>

  <!-- provider groups -->
  <rect x="60" y="430" width="160" height="72" rx="12" fill="#e8f2f3" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="140" y="456" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">LLM</text>
  <text x="140" y="478" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0d5c63">Groq</text>

  <rect x="240" y="430" width="160" height="72" rx="12" fill="#eef5f0" stroke="#5a7a62" stroke-width="1.5"/>
  <text x="320" y="456" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">RAG</text>
  <text x="320" y="478" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#5a7a62">Gemini</text>

  <rect x="420" y="430" width="160" height="72" rx="12" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="500" y="456" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Flights</text>
  <text x="500" y="478" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0d5c63">SerpApi</text>

  <rect x="600" y="430" width="160" height="72" rx="12" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="680" y="456" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Hotels</text>
  <text x="680" y="478" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0d5c63">StayingAPI</text>

  <rect x="780" y="430" width="160" height="72" rx="12" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="860" y="456" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Places</text>
  <text x="860" y="478" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0d5c63">Geoapify</text>

  <rect x="960" y="430" width="180" height="72" rx="12" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="1050" y="456" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Weather</text>
  <text x="1050" y="478" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0d5c63">Open-Meteo</text>

  <rect x="180" y="530" width="200" height="72" rx="12" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="280" y="556" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Distance</text>
  <text x="280" y="578" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0d5c63">OpenRouteService</text>

  <rect x="420" y="530" width="200" height="72" rx="12" fill="#fbf8f2" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="520" y="556" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Currency</text>
  <text x="520" y="578" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0d5c63">Frankfurter</text>

  <rect x="660" y="530" width="360" height="72" rx="12" fill="#f3ebe0" stroke="#8b8173" stroke-width="1.5"/>
  <text x="840" y="556" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1f2421">Deterministic Computation</text>
  <text x="840" y="578" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#8b8173">Budget engine + critic (not provider APIs)</text>

  <!-- upward arrows from providers to adapter boundary -->
  <line x1="140" y1="430" x2="140" y2="362" stroke="#8b8173" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="320" y1="430" x2="320" y2="362" stroke="#8b8173" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="500" y1="430" x2="500" y2="362" stroke="#8b8173" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="680" y1="430" x2="680" y2="362" stroke="#8b8173" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="860" y1="430" x2="860" y2="362" stroke="#8b8173" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="1050" y1="430" x2="1050" y2="362" stroke="#8b8173" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
</svg>
