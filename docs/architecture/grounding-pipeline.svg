<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ground-title ground-desc">
  <title id="ground-title">Grounding Pipeline</title>
  <desc id="ground-desc">User request through structured extraction, RAG and live facts to grounded catalog, deterministic calculations, critic, and approved itinerary.</desc>

  <rect width="1200" height="760" fill="#f4efe6"/>

  <text x="48" y="52" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="600" fill="#1f2421">Grounding Pipeline</text>
  <text x="48" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#8b8173">Reference knowledge + live provider facts -&gt; deterministic validation</text>

  <rect x="460" y="110" width="280" height="44" rx="12" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="138" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1f2421">User Request</text>

  <line x1="600" y1="154" x2="600" y2="178" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,178 596,170 604,170" fill="#0d5c63" opacity="0.6"/>

  <rect x="400" y="178" width="400" height="52" rx="12" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="202" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1f2421">Structured Extraction</text>
  <text x="600" y="220" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">TripRequest schema (Groq)</text>

  <line x1="600" y1="230" x2="600" y2="260" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,260 596,252 604,252" fill="#0d5c63" opacity="0.6"/>

  <!-- RAG + Live facts side by side -->
  <rect x="120" y="260" width="280" height="88" rx="14" fill="#eef5f0" stroke="#5a7a62" stroke-width="1.5"/>
  <text x="260" y="288" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2421">RAG Reference Context</text>
  <text x="260" y="310" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">Gemini embeddings</text>
  <text x="260" y="328" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">pgvector destination knowledge</text>

  <rect x="800" y="260" width="280" height="88" rx="14" fill="#e8f2f3" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="940" y="288" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1f2421">Live Provider Facts</text>
  <text x="940" y="310" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">flights, hotels, weather</text>
  <text x="940" y="328" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">places, distance, currency</text>

  <text x="600" y="310" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#0d5c63">+</text>

  <line x1="260" y1="348" x2="260" y2="378" stroke="#5a7a62" stroke-width="1.2" opacity="0.5"/>
  <line x1="940" y1="348" x2="940" y2="378" stroke="#0d5c63" stroke-width="1.2" opacity="0.5"/>
  <line x1="260" y1="378" x2="940" y2="378" stroke="#8b8173" stroke-width="1.2" opacity="0.5"/>
  <line x1="600" y1="378" x2="600" y2="398" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,398 596,390 604,390" fill="#0d5c63" opacity="0.6"/>

  <rect x="380" y="398" width="440" height="52" rx="14" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="422" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1f2421">Grounded Catalog</text>
  <text x="600" y="440" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">source tags, data_status, original provider prices</text>

  <line x1="600" y1="450" x2="600" y2="474" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,474 596,466 604,466" fill="#0d5c63" opacity="0.6"/>

  <rect x="400" y="474" width="400" height="52" rx="12" fill="#f3ebe0" stroke="#8b8173" stroke-width="1.5"/>
  <text x="600" y="498" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1f2421">Deterministic Calculations</text>
  <text x="600" y="516" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">Decimal budget engine, currency conversion</text>

  <line x1="600" y1="526" x2="600" y2="550" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,550 596,542 604,542" fill="#0d5c63" opacity="0.6"/>

  <rect x="400" y="550" width="400" height="52" rx="12" fill="#fbf8f2" stroke="#d9d0c4" stroke-width="1.5"/>
  <text x="600" y="574" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1f2421">Itinerary Candidate</text>
  <text x="600" y="592" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">grounded items only</text>

  <line x1="600" y1="602" x2="600" y2="626" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,626 596,618 604,618" fill="#0d5c63" opacity="0.6"/>

  <rect x="400" y="626" width="400" height="52" rx="12" fill="#f3ebe0" stroke="#8b8173" stroke-width="1.5"/>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1f2421">Critic</text>
  <text x="600" y="668" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#8b8173">budget, timing, provenance checks</text>

  <line x1="600" y1="678" x2="600" y2="698" stroke="#0d5c63" stroke-width="1.5" opacity="0.6"/>
  <polygon points="600,698 596,690 604,690" fill="#0d5c63" opacity="0.6"/>

  <rect x="420" y="698" width="360" height="44" rx="12" fill="#0d5c63" stroke="#0d5c63" stroke-width="1.5"/>
  <text x="600" y="726" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#fbf8f2">Approved Itinerary</text>
</svg>
