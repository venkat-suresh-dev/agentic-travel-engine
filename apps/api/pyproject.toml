[project]
name = "agentic-travel-engine-api"
version = "0.1.0"
description = "AI Trip Planner API foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agentic-travel-mcp-tools",
    "alembic>=1.19.1",
    "anthropic>=1.0.0",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.5",
    "httpx>=0.28.0",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "pgvector>=0.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.9.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
agentic-travel-mcp-tools = { path = "../../packages/mcp-tools", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
