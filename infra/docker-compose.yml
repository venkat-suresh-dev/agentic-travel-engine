services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: agentic-travel-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trip_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip_planner}
      POSTGRES_DB: ${POSTGRES_DB:-trip_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: agentic-travel-engine-postgres-data-v18
